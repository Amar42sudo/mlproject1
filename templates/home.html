<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Social Media User Mental Health Prediction
    </title>

</head>

<body>

    <h1>
        Social Media User Mental Health Prediction
    </h1>

    <form action="/predictdata" method="post">

        <input type="number"
               name="age"
               placeholder="Age"
               required>

        <br><br>

        <input type="text"
               name="gender"
               placeholder="Gender"
               required>

        <br><br>

        <input type="number"
               step="0.1"
               name="daily_social_media_hours"
               placeholder="Daily Social Media Hours"
               required>

        <br><br>

        <input type="text"
               name="platform_usage"
               placeholder="Platform Usage"
               required>

        <br><br>

        <input type="number"
               step="0.1"
               name="sleep_hours"
               placeholder="Sleep Hours"
               required>

        <br><br>

        <input type="number"
               step="0.1"
               name="screen_time_before_sleep"
               placeholder="Screen Time Before Sleep"
               required>

        <br><br>

        <input type="text"
               name="academic_performance"
               placeholder="Academic Performance"
               required>

        <br><br>

        <input type="text"
               name="physical_activity"
               placeholder="Physical Activity"
               required>

        <br><br>

        <input type="text"
               name="social_interaction_level"
               placeholder="Social Interaction Level"
               required>

        <br><br>

        <input type="text"
               name="stress_level"
               placeholder="Stress Level"
               required>

        <br><br>

        <input type="text"
               name="anxiety_level"
               placeholder="Anxiety Level"
               required>

        <br><br>

        <input type="text"
               name="addiction_level"
               placeholder="Addiction Level"
               required>

        <br><br>

        <button type="submit">

            Predict

        </button>

    </form>

    <h2>

        Prediction: {{ results }}

    </h2>

</body>

</html>
